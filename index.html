<!DOCTYPE html>
<html lang="en">
    <head>
        <title>IPMA Weather</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Weather web application with data from IPMA.">
        <meta name="theme-color" content="#299FC6"/>
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="apple-touch-icon" href="IPMA-logo.png">
        <link rel="stylesheet" type="text/css" href="style.css">
        <script type='text/javascript' src='js.js'></script>
    </head>

    <body onload="get_data()">
        <div id="hero_div">
            <div id="search_container">
                <input id="location_search" type="text" placeholder="Tondela, Viseu">
            </div>
        </div>

        <div id="time_options">
            <div id="inner_time_options">
                <div class="button" id="today" onclick="switch_tab('today')">
                    <p>Hoje</p>
                </div>
                <div class="button" id="tomorrow" onclick="switch_tab('tomorrow')">
                    <p>Amanhã</p>
                </div>
                <div class="button" id="next_days" onclick="switch_tab('next_days')">
                    <p>5 dias</p>
                </div>
            </div>
        </div>



        <div id="table_today" class="table">
            <div id="table_container" style="height: 100%; max-width: 400px;">
                <table class="content_table" style="background-color: rgba(114, 197, 197, 0.2); width: 100%;height: 100%; margin-left: auto; margin-right: auto;text-align: center; padding-bottom: 10px;border-radius: 10px;vertical-align: middle;">
                    <tr>
                        <td id="location" colspan="3" style="font-size: 15px; padding-top:10px;">Tondela, Viseu</td>
                    </tr>
                    <tr>
                        <th id="table_temp" colspan="3" style="font-size: 50px;padding-bottom: 20px;"></th>
                    </tr>
                    <tr>
                        <td id="tMax" style="padding-bottom: 20px;"></td>
                        <td id="iUv" style="padding-bottom: 20px;"></td> 
                    </tr>
                    <tr>
                        <td id="tMin"></td>
                        <td id="probabilidadePrecipita"></td>
                    </tr>
                    <tr>
                        <td id="data_update" colspan="3" style="font-size: 8px; padding-top:10px;">Última atualização:</td>
                     </tr>
                </table>
            </div>
        </div>
        <div id="table_tomorrow" class="table">
            <div id="table_containerT" style="height: 100%; max-width: 400px;">
                <table class="content_table" style="background-color: rgba(114, 197, 197, 0.2); width: 100%;height: 100%; margin-left: auto; margin-right: auto;text-align: center; padding-bottom: 10px;border-radius: 10px;vertical-align: middle;">
                    <tr style="margin-bottom: 20px;">
                        <td id="locationT" colspan="3" style="font-size: 15px; padding-top:10px;padding-bottom: 20px;">Tondela, Viseu</td>
                    </tr>
                    <tr>
                        <td id="tMaxT" style="padding-bottom: 20px;"></td>
                        <td id="iUvT" style="padding-bottom: 20px;"></td> 
                    </tr>
                    <tr>
                        <td id="tMinT"></td>
                        <td id="probabilidadePrecipitaT"></td>
                    </tr>
                    <tr>
                        <td id="data_updateT" colspan="3" style="font-size: 8px; padding-top:10px;">Última atualização:</td>
                     </tr>
                </table>
            </div>
        </div>
        <div id="table_next_days" style="height: auto; width: 80%; max-width: 400px; margin-top:30px;margin-left: auto; margin-right: auto;">
            
        </div>

        <div class="rows" id="today_row">
            <div class="inner" id="innerToday"></div>
        </div>
        <div class="rows" id="tomorrow_row">
            <div class="inner" id="innerTomorrow"></div>
        </div>
        <div class="rows" id="next_days_row">
            <div class="inner" id="inner_next_days"></div>
        </div>

        
        <div class="rows content_table" id="settings_row" style="height: 300px; background-color: rgba(114, 197, 197, 0.2);width:80%; max-width: 400px;border-radius: 10px;margin-top: 30px;">
            <div style="width: fit-content; margin-left: auto;margin-right: auto; margin-top: 10px;">
                <h3>DEFINIÇÕES</h3>
            </div>
            <hr style="color: black; height: 3px; width: 100px; display: block;">
            <div style="width: 90%; margin-left: auto; margin-right: auto;margin-top: 15px;">
                <h4>Tema</h4>
            </div>
            <div class="inner" id="temas" style="height: 50px; margin-top:10px;">
                <div class="theme_row" id="claro_button" onclick="switch_theme('claro')">
                    <p style="text-align:center; line-height:18px; height: 18px; padding-top: 16px;">Claro</p>
                </div>
                <div class="theme_row" id="escuro_button" onclick="switch_theme('escuro')">
                    <p style="text-align:center; line-height:18px; height: 18px; padding-top: 16px;">Escuro</p>
                </div>
            </div>
            <div style="width: 90%; margin-left: auto; margin-right: auto;margin-top: 15px;">
                <h4>Cor de destaque</h4>
            </div>
            <div class="inner" id="cores" style="height: 50px; margin-top:10px;">
                <div class="color_button" onclick="switch_colors('192, 133, 106')" style="background-color: rgb(192, 133, 106);">
                    <div style="width: 100%; height: 100%;"></div>
                </div>
                <div class="color_button" onclick="switch_colors('106, 192, 149')" style="background-color: rgb(106, 192, 149);">
                    <div style="width: 100%; height: 100%;"></div>
                </div>
                <div class="color_button" onclick="switch_colors('106, 153, 192')" style="background-color: rgb(106, 153, 192);">
                    <div style="width: 100%; height: 100%;"></div>
                </div>
                <div class="color_button" onclick="switch_colors('146, 106, 192')" style="background-color: rgb(146, 106, 192);">
                    <div style="width: 100%; height: 100%;"></div>
                </div>
            </div>
        </div>


        <div class="rows" id="about_row" style="height: 300px; background-color: rgba(114, 197, 197, 0.2);width:80%; max-width: 400px;border-radius: 10px;margin-top: 30px;">
            <div style="bottom: 0;text-align: left;line-height: 15px;margin-left: 10px; margin-right: 10px; margin-top: 10px;">
                Icons made by 
                <a href="https://www.flaticon.com/authors/flat-icons" title="Flat Icons">
                    Flat Icons
                </a> from 
                <a href="https://www.flaticon.com/" title="Flaticon">
                    www.flaticon.com
                </a>
            </div>
            <div style="bottom: 0;text-align: left;line-height: 15px;margin-left: 10px; margin-right: 10px; margin-top: 15px;">
                Dados da metereologia provenientes de: <a href="https://www.ipma.pt/pt/index.html" title="IPMA">
                    www.ipma.pt
                </a>
            </div>
        </div>        

        <div class="rows" style="height: auto;">
            <div class="inner" style="height:auto;margin-bottom: 10px;">
                <div class="button" id="about" onclick="switch_tab('about')">
                    <p>Sobre</p>
                </div>
                <div class="button" id="settings" onclick="switch_tab('settings')" style="width:38px;border-radius: 50%;">
                    <div style="width: 38px; height: 38px;"><img id="settings_icon" src="settings_w.svg" alt="settings icon" style="height: 20px; margin-left: 9px; margin-top: 9px;"></div>
                </div>
            </div>
        </div>



    </body>
</html>
