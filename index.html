<!DOCTYPE html>
<html lang="pt">
    <head>
        <title>Weather</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="description" content="Weather web application with data from IPMA.">
        <meta name="theme-color" content="#299FC6"/>
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="apple-touch-icon" href="logos/logo.png">
        <link rel="stylesheet" type="text/css" href="style.css">
        <script type='text/javascript' src='js.js'></script>
        <script type='text/javascript' src='locations.js'></script>
    </head>

    <body onload="init()">
        
        <div id="fav-notification">
            <div id="fav-notification-inner"></div>
        </div>
        <div id="">
            <div id="hero_div">
                <div id="search_container">
                    <input autocomplete="off" id="location" type="text" onkeyup="search_location()" placeholder="Pesquisar...">
                </div>
            </div>
        </div>

        <div class="rows" id="location-tab">
            <div id="time_options">
                <div id="inner_time_options">
                    <div class="button" id="close" onclick="switch_tab('home-tab')" style="width:38px;border-radius: 50%;">
                        <div style="width: 38px; height: 38px;"><img id="close_icon" src="close_b.svg" alt="update icon" style="height: 20px; margin-left: 9px; margin-top: 9px;"></div>
                    </div>
                </div>
            </div>
            
            <ul id="location-list">
            </ul>
        </div> 

        <div class="rows" id="favorites-tab" style="display: none;">
            
            <h2 style="margin-left: 30px; margin-top:40px;">Favoritos</h2>

        </div> 

        <div id="home-tab" style="margin-bottom: 85px;">
            <div id="table_today" class="table">
                <div id="table_container" style="height: 100%; max-width: 400px;">
                    <table class="content_table" style=" width: 100%;height: 100%; margin-left: auto; margin-right: auto;text-align: center; padding-bottom: 10px;border-radius: 10px;vertical-align: middle;">
                        <tr>
                            <td colspan="4">
                                <div id="fav_icon_container" onclick="add_favorite('1999')" style="width: auto; height: auto;">
                                    <img id="fav_icon" src="not_fav_b.svg" alt="settings icon" style="height: 15px;">
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td id="location-text" colspan="4" style="font-size: 15px; padding-top:10px;"></td>
                        </tr>
                        <tr style="text-align: center; width: 100%;">
                            <th id="table_temp" colspan="4" style="text-align:center;line-height:70px;font-size:70px;padding-bottom: 40px;padding-top: 10px;"></th>
                        </tr>
                        <tr>
                            <td id="tMax">
                                <div style="display: inline-block;">
                                    <img class="table_icons" alt="temperatura máxima" src="icons/icons_table/tMax.svg">
                                </div>
                                <div style="display: inline-block;">
                                    <p class="table-text" id="text-tMax"></p>
                                </div>                     
                            </td>
                            <td id="tMin">
                                <div style="display: inline-block;">
                                    <img class="table_icons" alt="temperatura mínima" src="icons/icons_table/tMin.svg">
                                </div>
                                <div style="display: inline-block;">
                                    <p class="table-text" id="text-tMin"></p>
                                </div> 
                            <td id="iUv"> 
                                <div style="display: inline-block;">
                                    <img class="table_icons" alt="índice UV" src="icons/icons_table/iUv.svg">
                                </div>
                                <div style="display: inline-block;">
                                    <p class="table-text" id="text-iUv"></p>
                                </div>                     
                            </td> 
                                <td id="probabilidadePrecipita">
                                    <div style="display: inline-block;">
                                        <img class="table_icons" alt="probabilidade precipitação" src="icons/icons_table/probabilidadePrecipita.svg">
                                    </div>
                                    <div style="display: inline-block;">
                                        <p class="table-text" id="text-probabilidadePrecipita"></p>
                                    </div>
                                </td>
                            </td>
                        </tr>
                        <tr>
                            <td id="data-update" colspan="4" style="font-size: 8px; padding-top:10px;">Última atualização:</td>
                        </tr>
                    </table>
                </div>
            </div>
            

            <div class="rows" id="today_row">
                <div class="inner" id="innerToday"></div>
            </div>
            <br>
            <h2 style="margin-left: 30px; margin-top:40px;">Amanhã</h2>
            <div class="rows" id="tomorrow_row">
                <div class="inner" id="innerTomorrow"></div>
            </div>
            <div id="table_tomorrow" class="table" style="display: block;">
                <div id="table_container" style="height: 100%; max-width: 400px;">
                    <table class="content_table" style="width: 100%;height: 100%; margin-left: auto; margin-right: auto;text-align: center; padding-bottom: 10px;border-radius: 10px;vertical-align: middle;">
                        <tr>
                            <td id="tMaxT">
                                <div style="display: inline-block;">
                                    <img class="table_icons" src="icons/icons_table/tMax.svg">
                                </div>
                                <div style="display: inline-block;">
                                    <p class="table-text-T" id="text-tMax"></p>
                                </div>                     
                            </td>
                            <td id="tMinT">
                                <div style="display: inline-block;">
                                    <img class="table_icons" src="icons/icons_table/tMin.svg">
                                </div>
                                <div style="display: inline-block;">
                                    <p class="table-text-T" id="text-tMin"></p>
                                </div> 
                            </td>
                            <td id="iUvT"> 
                                <div style="display: inline-block;">
                                    <img class="table_icons" src="icons/icons_table/iUv.svg">
                                </div>
                                <div style="display: inline-block;">
                                    <p class="table-text-T" id="text-iUv"></p>
                                </div>                     
                            </td> 
                            <td id="probabilidadePrecipitaT">
                                <div style="display: inline-block;">
                                    <img class="table_icons" src="icons/icons_table/probabilidadePrecipita.svg">
                                </div>
                                <div style="display: inline-block;">
                                    <p class="table-text-T" id="text-probabilidadePrecipita"></p>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
            <br>
            <div class="rows" id="next_days_row">
                <h2 style="margin-left: 30px;">Próximos 10 dias</h2>
                <br>
                <div class="inner" id="inner_next_days"></div>
            </div>
        </div>

        <div id="settings-tab">
            <div style="height: fit-content; width:80%; max-width: 400px;border-radius: 10px;margin-top: 0px; top:0; margin-left: auto; margin-right: auto;">
                <div style="width: fit-content; margin-left: auto;margin-right: auto; margin-top: 10px;">
                    <h3>DEFINIÇÕES</h3>
                </div>
                <div style="width: 90%; margin-left: auto; margin-right: auto;margin-top: 15px;">
                    <h4>Tema</h4>
                </div>
                <div class="inner" id="temas" style="height: 50px; margin-top:10px;">
                    <div class="theme_row" id="claro_button" onclick="switch_theme('claro')">
                        <p style="text-align:center; line-height:18px; height: 18px; padding-top: 16px;">Claro</p>
                    </div>
                    <div class="theme_row" id="escuro_button" onclick="switch_theme('escuro')">
                        <p style="text-align:center; line-height:18px; height: 18px; padding-top: 16px;">Escuro</p>
                    </div>
                </div>

                <br>
                <hr style="height: 1px;">
                <div style="width: 90%; margin-left: auto; margin-right: auto;margin-top: 15px;">
                    <h4>Cor de destaque</h4>
                </div>
                <div class="inner" id="cores" style="height: 50px; margin-top:10px;">
                    <div class="color_button" onclick="switch_colors('114, 197, 197')" style="background-color: rgb(114, 197, 197);">
                        <div style="width: 100%; height: 100%;"></div>
                    </div>
                    <div class="color_button" onclick="switch_colors('192, 133, 106')" style="background-color: rgb(192, 133, 106);">
                        <div style="width: 100%; height: 100%;"></div>
                    </div>
                    <div class="color_button" onclick="switch_colors('106, 192, 149')" style="background-color: rgb(106, 192, 149);">
                        <div style="width: 100%; height: 100%;"></div>
                    </div>
                    <div class="color_button" onclick="switch_colors('106, 153, 192')" style="background-color: rgb(106, 153, 192);">
                        <div style="width: 100%; height: 100%;"></div>
                    </div>
                    <div class="color_button" onclick="switch_colors('146, 106, 192')" style="background-color: rgb(146, 106, 192);">
                        <div style="width: 100%; height: 100%;"></div>
                    </div>
                </div>
                
                <div style="width: 90%; margin-left: auto; margin-right: auto;margin-top: 15px;">
                    <div style="margin-left: auto; margin-right: auto; text-align: center;">
                        <input class="color-textb" id="red" type="number" placeholder="R"></input>
                        <input class="color-textb" id="green" type="number" placeholder="G"></input>
                        <input class="color-textb" id="blue" type="number" placeholder="B"></input>
                        <div id="apply-color-button" style="display: inline-block;" onclick="set_rgb()">
                            <p>Aplicar</p>
                        </div>
                        <div id="color-warning" style="width: 100%; display: none;">
                            <small style="color:red;">Apenas valores entre 0 e 255</small>
                        </div>
                    </div>
                </div>

                <br>
                <hr style="height: 1px;">

                <div style="bottom: 0;text-align: left;line-height: 15px;margin-left: 10px; margin-right: 10px; margin-top: 50px;">
                    Icons made by 
                    <a href="https://www.flaticon.com/authors/flat-icons" title="Flat Icons">
                        Flat Icons
                    </a> from 
                    <a href="https://www.flaticon.com/" title="Flaticon">
                        www.flaticon.com
                    </a>
                </div>
                <div style="bottom: 0;text-align: left;line-height: 15px;margin-left: 10px; margin-right: 10px; margin-top: 15px;">
                    Dados da metereologia provenientes de: <a href="https://www.ipma.pt/pt/index.html" title="IPMA">
                        www.ipma.pt
                    </a>
                </div>
            </div>
        </div>     
        
        <div class="rows" id="bottom-options">
            <div class="inner" style="height:auto;">

                <div class="button" id="home-button" onclick="get_data(localStorage['local_id'])">
                    <img id="home_icon" src="is_home_w.svg" alt="home icon" style="height: 30px;">
                </div>

                <hr class="bottom-divider">

                <div class="button" id="favorites-button" onclick="switch_tab('favorites-tab')">
                    <img id="favorite_icon" src="not_favorite_w.svg" alt="favorites icon" style="height: 30px;">
                </div>

                <hr class="bottom-divider">

                <div class="button" id="settings-button" onclick="switch_tab('settings-tab')">
                    <img id="settings_icon" src="not_settings_w.svg" alt="settings icon" style="height: 30px;">
                </div>
                
            </div>
        </div>


        <script>
            var prevScrollpos = window.pageYOffset;
            window.onscroll = function() {
                var currentScrollPos = window.pageYOffset;
                //console.log(prevScrollpos);
                if (prevScrollpos > currentScrollPos || prevScrollpos < 120) {
                    document.getElementById("bottom-options").style.bottom = "0";
                } 
                else {
                    document.getElementById("bottom-options").style.bottom = "-80px";
                }
                prevScrollpos = currentScrollPos;
                }
        </script>
    </body>
</html>
