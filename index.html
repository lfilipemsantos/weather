<!DOCTYPE html>
<html lang="en">
    <head>
        <title>IPMA Weather</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="apple-touch-icon" href="IPMA-logo.png">
        <link rel="stylesheet" type="text/css" href="style.css">
        <script type='text/javascript' src='js.js'></script>
    </head>

    <body onload="get_data()">
        <div id="hero_div">
            <div id="search_container">
                <input id="location_search" type="text" placeholder="Tondela, Viseu">
            </div>
        </div>

        <div id="time_options">
            <div id="inner_time_options">
                <div class="time_option selected" id="today_selector" onclick="switch_tab('today')">
                    <p style="text-align:center; line-height:18px">Hoje</p>
                </div>
                <div class="time_option" id="tomorrow_selector" onclick="switch_tab('tomorrow')">
                    <p style="text-align:center; line-height:18px">Amanhã</p>
                </div>
                <div class="time_option" id="next_days_selector" onclick="switch_tab('next_days')">
                    <p style="text-align:center; line-height:18px">5 dias</p>
                </div>
            </div>
        </div>



        <div style="height: auto; width: 80%; max-width: 400px; margin-top:30px;margin-left: auto; margin-right: auto;">
            <div id="table_container" style="height: 100%; max-width: 400px;">
                <table style="background-color: rgba(114, 197, 197, 0.2); width: 100%;height: 100%; margin-left: auto; margin-right: auto;text-align: center; padding-bottom: 10px;border-radius: 10px;vertical-align: middle;">
                    <tr>
                        <td id="location" colspan="3" style="font-size: 15px; padding-top:10px;">Tondela, Viseu</td>
                    </tr>
                    <tr>
                        <th id="table_temp" colspan="3" style="font-size: 50px;padding-bottom: 20px;"></th>
                    </tr>
                    <tr>
                        <td id="tMax" style="padding-bottom: 20px;"></td>
                        <td id="iUv" style="padding-bottom: 20px;"></td> 
                    </tr>
                    <tr>
                        <td id="tMin"></td>
                        <td id="probabilidadePrecipita"></td>
                    </tr>
                    <tr>
                        <td id="data_update" colspan="3" style="font-size: 8px; padding-top:10px;">Última atualização:</td>
                     </tr>
                </table>
            </div>
            <div style="height:0%;width:fit-content;background-color: bisque; ">
            </div>
        </div>

        <div class="rows" id="today">
            <div class="inner" id="innerToday"></div>
        </div>
        <div class="rows" id="tomorrow">
            <div class="inner" id="innerTomorrow"></div>
        </div>
        <div class="rows" id="next_days">
            <div class="inner" id="inner_next_days"></div>
        </div>

        <div class="rows">
            <div class="inner">
                <div class="time_option">
                    <p style="text-align:center; line-height:18px">Sobre</p>
                </div>
                <div class="time_option" style="width:40px; height: 40px; padding-top:0px; padding-bottom:0px; border-radius: 50%; vertical-align: center;">
                    <div style="width: 100%; height: 100%;"><img src="settings.svg" style="height: 60%; margin-left: 20%; margin-top: 20%;"></div>
                </div>
            </div>
        </div>

        <div id="about" style="width:100%; bottom: 0px; margin-top: auto; background-color: azure;position: relative;">
            <div style="bottom: 0;text-align: center;">
                Icons made by 
                <a href="https://www.flaticon.com/authors/flat-icons" title="Flat Icons">
                    Flat Icons
                </a> from 
                <a href="https://www.flaticon.com/" title="Flaticon">
                    www.flaticon.com
                </a>
            </div>
        </div>

    </body>
</html>
