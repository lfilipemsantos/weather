<!DOCTYPE html>
<html lang="en">
    <head>
        <title>IPMA Weather</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="apple-touch-icon" href="IPMA-logo.png">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
        <script type='text/javascript' src='js.js'></script>
    </head>

    <body onload="get_data()">
        <div class="" id="hero_div">
            <!--<h5 id="hero_title">Weather</h5>-->
            <div id="search_container">
                <input id="location_search" type="text" placeholder="Tondela, Viseu">
            </div>
        </div>

        <div id="time_options">
            <a class="time_option selected" id="today_selector" onclick="switch_tab('today')">Hoje</a>
            <a class="time_option" id="tomorrow_selector" onclick="switch_tab('tomorrow')">Amanhã</a>
            <a class="time_option" id="next_days_selector" onclick="switch_tab('next_days')">5 dias</a>
        </div>

        <!--<div id="chartContainer">

        </div>-->

        <div style="height: 260px; width: 80%; max-width: 400px; margin-top:20px;margin-left: auto; margin-right: auto; background-color: azure; margin-bottom: 80px;">
            <div id="table_container" style="height: 100%; max-width: 400px;">
                <table style="background-color: rgba(71, 121, 122, 0.507); width: 100%;height: 100%; margin-left: auto; margin-right: auto;text-align: center; padding-bottom: 10px;border-radius: 10px;vertical-align: middle;">
                    <tr>
                        <td id="location" colspan="3" style="font-size: 15px; padding-top:10px;">Tondela, Viseu</td>
                     </tr>
                     <tr>
                        <th id="table_temp" colspan="3" style="font-size: 50px;"></th>
                     </tr>
                     <tr>
                        <td id="tmax" style="padding-bottom: 20px;"></td>
                        <td id="uv" style="padding-bottom: 20px;"></td> 
                     </tr>
                     <tr>
                        <td id="tmin"></td>
                        <td id="prec"></td>
                     </tr>
                </table>
            </div>
            <div style="height:0%;width:fit-content;background-color: bisque; ">
            </div>
        </div>

        <div class="rows" id="today">
            <div class="inner" id="innerToday"></div>
        </div>
        <div class="rows" id="tomorrow">
            <div class="inner" id="innerTomorrow"></div>
        </div>
        <div class="rows" id="next_days">
            <div class="inner" id="inner_next_days"></div>
        </div>

        <div id="about" style="bottom: 0px; margin-top: auto;">
            <div style="bottom: 0;">Icons made by <a href="https://www.flaticon.com/authors/flat-icons" title="Flat Icons">Flat Icons</a> from <a href="https://www.flaticon.com/" title="Flaticon">www.flaticon.com</a></div>
        </div>

    </body>
</html>
