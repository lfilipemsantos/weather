<!DOCTYPE html>
<html lang="en">
    <head>
        <title>IPMA Weather</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="manifest" href="manifest.json">
        <link rel="stylesheet" type="text/css" href="style.css">
        <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css"/>
        <script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
        <script type='text/javascript' src='js.js'></script>
    </head>

    <body onload="get_data()">
        <div class="" id="hero_div">
            <!--<h5 id="hero_title">Weather</h5>-->
            <div id="search_container">
                <input id="location_search" type="text" placeholder="Tondela, Viseu">
            </div>
        </div>

        <div id="time_options">
            <a class="time_option selected">Hoje</a>
            <a class="time_option">Amanhã</a>
            <a class="time_option">5 dias</a>
        </div>

        <!--<div id="chartContainer">

        </div>-->

        <div style="height: 150px; width: 90%; margin-left: auto; margin-right: auto; background-color: azure;">
            <div id="table_container" style="height: 100%;">
                <table style="background-color: cadetblue; width: 100%;height: 100%; margin-left: auto; margin-right: auto;text-align: center; padding-bottom: 10px;">
                    <tr>
                        <th id="table_temp" colspan="3" style="font-size: 50px;"></th>
                     </tr>
                     <tr>
                        <td id="tmax"></td>
                        <td id="uv"></td>
                     </tr>
                     <tr>
                        <td id="tmin"></td>
                        <td id="prec"></td>
                     </tr>
                </table>
            </div>
            <div style="height:0%;width:fit-content;background-color: bisque; ">
            </div>
        </div>

        <div id="rows">
        </div>

    </body>
</html>
